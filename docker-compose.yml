services:
  db:
    image: postgres:15
    platform: linux/amd64
    environment:
      POSTGRES_DB: blog_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d blog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    platform: linux/amd64
    command: bash -c "python manage.py makemigrations && python manage.py migrate && gunicorn --bind 0.0.0.0:8000 core.wsgi:application"
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: owasp/modsecurity-crs:nginx
    platform: linux/amd64
    user: "0:0"
    ports:
      - "80:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - PARANOIA=8080
      - PARANOIA=1
      - MODSEC_RULE_ENGINE=DetectionOnly
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_AUDIT_LOG_TYPE=Serial
      - MODSEC_AUDIT_LOG=/var/log/nginx/modsec_audit.log
      - MODSEC_AUDIT_LOG_FORMAT=JSON
      - ACCESSLOG=/var/log/nginx/access.log
      - ERRORLOG=/var/log/nginx/error.log
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template
      - ./media:/app/media
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web

  suricata:
    image: jasonish/suricata:latest
    platform: linux/amd64
    network_mode: "service:nginx"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    command: -i eth0
    volumes:
      - ./logs/suricata:/var/log/suricata
      - ./logs/suricata/suricata.rules:/var/lib/suricata/rules/suricata.rules
    depends_on:
      - nginx

volumes:
  postgres_data: