<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecBlog - SOC Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .card { border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-info" href="/">🛡️ SecBlog Lab</a>
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-light me-3">Xin chào, <strong>{{ user.username }}</strong></span>
                    <a href="/create/" class="btn btn-sm btn-success me-2">+ Đăng bài & Upload</a>
                    <a href="/change-password/" class="btn btn-sm btn-warning me-2">Đổi mật khẩu</a>
                    <a href="/logout/" class="btn btn-sm btn-outline-light">Đăng xuất</a>
                {% else %}
                    <a href="/login/" class="btn btn-sm btn-primary">Đăng nhập</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
